##############################################################################
# docker-compose.yml — Transient Event Detection
#
# THE single entry point for the entire stack.
#
#   docker compose up --build        # foreground (logs visible)
#   docker compose up -d --build     # detached (background)
#   docker compose down              # stop (data preserved)
#   docker compose down -v           # stop + wipe all volumes
#
# Services and startup order (healthcheck-based)
# ──────────────────────────────────────────────
#   postgres (healthy)
#       ↓
#   migrate (completed_successfully)   ← runs Drizzle migrations once
#       ↓
#   python-backend (healthy)           ← GCN Kafka consumer + FastAPI WebSocket
#       ↓
#   api-server (healthy)               ← Express REST API + WebSocket bridge
#       ↓
#   frontend                           ← nginx serving Vite SPA + /api proxy
#
# Public ports
# ────────────
#   5173  → Frontend (nginx SPA)
#   8000  → API server (direct access / debugging)
#   8001  → Python backend (direct access / debugging)
#   5432  → PostgreSQL (direct access / debugging)
#
# Secrets
# ───────
#   All variables come from the root .env file.
#   No secrets are hardcoded. No secrets are baked into images.
#
#   Required in .env:
#     POSTGRES_PASSWORD, POSTGRES_PASSWORD_URLENC
#     JWT_SECRET, GOOGLE_CLIENT_ID
#     GEMINI_API_KEY
#     ORCID_CLIENT_ID, ORCID_CLIENT_SECRET
#     GCN_CLIENT_ID, GCN_CLIENT_SECRET
#
#   See .env.example for all variables and descriptions.
##############################################################################

services:

  # ── 1. PostgreSQL (PostGIS) ───────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-Astro-sentinel}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - cosmic

    healthcheck:
      # -h 127.0.0.1 is REQUIRED — do not remove it.
      #
      # Without -h, pg_isready probes the Unix socket. On a fresh volume the
      # official entrypoint runs initdb against a TEMPORARY server started with
      # listen_addresses='' — reachable on the socket but NOT over TCP. The
      # healthcheck therefore reported "healthy" mid-initialisation, the migrate
      # container connected over TCP and died with ECONNREFUSED, and api-server
      # never started because it gates on migrate completing.
      #
      # Probing 127.0.0.1 forces the check to test the same TCP listener every
      # other service actually connects to, so "healthy" means reachable.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Astro-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 2. Database migrations (one-shot, exits 0 on success) ─────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate

    restart: "no"

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENC}@postgres:5432/${POSTGRES_DB:-Astro-sentinel}"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cosmic

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── 3. Python backend (GCN Kafka consumer + FastAPI WebSocket) ─────────────
  python-backend:
    build:
      context: .
      dockerfile: Dockerfile.python

    restart: unless-stopped

    environment:
      GCN_CLIENT_ID:     ${GCN_CLIENT_ID}
      GCN_CLIENT_SECRET: ${GCN_CLIENT_SECRET}
      # Priority #8 — this service is the one that actually calls OpenAI, via
      # /api/science/openai-circular-extraction. Defaulted OFF/empty so the
      # path is a no-op unless a deployment sets them deliberately.
      CIRCULAR_OPENAI_EXTRACTION_ENABLED: ${CIRCULAR_OPENAI_EXTRACTION_ENABLED:-false}
      OPENAI_API_KEY:                     ${OPENAI_API_KEY:-}
      GCN_PHOTOMETRY_AI_TIMEOUT_SECONDS:  ${GCN_PHOTOMETRY_AI_TIMEOUT_SECONDS:-60}
      GCN_PHOTOMETRY_AI_RETRIES:          ${GCN_PHOTOMETRY_AI_RETRIES:-1}

    ports:
      - "8001:8001"

    networks:
      - cosmic

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 4. API server (Express + Drizzle ORM + WebSocket bridge) ──────────────
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api

    restart: unless-stopped

    environment:
      PORT:                 "8000"
      NODE_ENV:             production

      DATABASE_URL:         "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENC}@postgres:5432/${POSTGRES_DB:-Astro-sentinel}"
      PYTHON_BACKEND_URL:   "ws://python-backend:8001/api/ws"

      JWT_SECRET:           ${JWT_SECRET}
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID}

      GEMINI_API_KEY:       ${GEMINI_API_KEY}
      # Priority #8 — billed OpenAI extraction. Defaulted OFF/empty: a compose
      # file that can turn on spending by omission is not a safe default.
      CIRCULAR_OPENAI_EXTRACTION_ENABLED: ${CIRCULAR_OPENAI_EXTRACTION_ENABLED:-false}
      OPENAI_API_KEY:       ${OPENAI_API_KEY:-}
      GEMINI_MODEL:         ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_MS:    ${GEMINI_TIMEOUT_MS:-45000}

      ORCID_CLIENT_ID:      ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET:  ${ORCID_CLIENT_SECRET}

      # ── LLM provider (vendor-neutral) ───────────────────────────────────
      # Preferred over the GEMINI_* variables above, which still work when
      # LLM_PROVIDER is unset. Without these the container can only ever use
      # Gemini, whatever .env says.
      LLM_PROVIDER:         ${LLM_PROVIDER:-}
      LLM_API_KEY:          ${LLM_API_KEY:-}
      LLM_MODEL:            ${LLM_MODEL:-}
      LLM_BASE_URL:         ${LLM_BASE_URL:-}
      LLM_TIMEOUT_MS:       ${LLM_TIMEOUT_MS:-45000}

      # ── GCN Circulars ───────────────────────────────────────────────────
      # Both default ON in code, so omitting them leaves circular ingestion
      # and AI enrichment running — this block exists so they can be turned
      # OFF from .env, which was impossible before.
      GCN_CIRCULARS_ENABLED:            ${GCN_CIRCULARS_ENABLED:-true}
      # false still ingests, associates and serves circulars; they simply
      # carry no AI extraction. The correct setting when no LLM is configured.
      CIRCULAR_AI_EXTRACTION:           ${CIRCULAR_AI_EXTRACTION:-true}
      CIRCULAR_EXTRACTION_POLL_MS:      ${CIRCULAR_EXTRACTION_POLL_MS:-15000}
      CIRCULAR_EXTRACTION_BATCH:        ${CIRCULAR_EXTRACTION_BATCH:-3}
      CIRCULAR_EXTRACTION_MAX_ATTEMPTS: ${CIRCULAR_EXTRACTION_MAX_ATTEMPTS:-4}
      # Off by default: a circular's only timestamp is when a human pressed
      # send, not the trigger time, so timing is a weak discriminator and a
      # wrong attachment is worse than an honest UNMATCHED.
      GCN_CIRCULAR_PROBABILISTIC_ASSOCIATION:  ${GCN_CIRCULAR_PROBABILISTIC_ASSOCIATION:-false}
      GCN_CIRCULAR_PROBABILISTIC_WINDOW_HOURS: ${GCN_CIRCULAR_PROBABILISTIC_WINDOW_HOURS:-48}

      # ── Outbound email ──────────────────────────────────────────────────
      # None of this was passed to the container before, so EMAIL_PROVIDER
      # defaulted to "none" in every Docker deployment and no mail was ever
      # sent — including team invitations, which were still reported as
      # delivered. Set EMAIL_PROVIDER in .env to smtp | resend | sendgrid.
      EMAIL_PROVIDER:          ${EMAIL_PROVIDER:-none}
      SMTP_HOST:               ${SMTP_HOST:-}
      SMTP_PORT:               ${SMTP_PORT:-587}
      SMTP_SECURE:             ${SMTP_SECURE:-false}
      SMTP_USER:               ${SMTP_USER:-}
      SMTP_PASS:               ${SMTP_PASS:-}
      RESEND_API_KEY:          ${RESEND_API_KEY:-}
      SENDGRID_API_KEY:        ${SENDGRID_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-}
      NOTIFICATION_FROM_NAME:  ${NOTIFICATION_FROM_NAME:-Transient Event Detection}

      # The externally reachable address of this deployment. Used to build
      # invitation links and event links in notifications. It cannot be
      # derived from the request: inside compose the api-server only sees an
      # internal host, so a link built from the Host header resolves nowhere
      # outside the Docker network.
      PUBLIC_APP_URL:          ${PUBLIC_APP_URL:-}

      # ── Notification providers ──────────────────────────────────────────
      # Encrypts provider credentials (e.g. the WeCom robot webhook) at rest
      # in alerts.alert_subscriptions.channel_config. Without it the WeChat
      # configuration endpoints return 503 rather than storing a plaintext
      # secret. Generate with: openssl rand -hex 32
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY}
      # true routes every provider send to an in-process sink. Use it to
      # exercise the pipeline without posting to a real WeCom group.
      NOTIFICATION_TEST_MODE:      ${NOTIFICATION_TEST_MODE:-false}
      NOTIFICATION_MAX_ATTEMPTS:   ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_RETRY_BACKOFF_MS: ${NOTIFICATION_RETRY_BACKOFF_MS:-}

    ports:
      - "8000:8000"

    networks:
      - cosmic

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      python-backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "node --input-type=module -e \"fetch('http://localhost:8000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── 5. Frontend (nginx serving Vite bundle + /api proxy) ──────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    networks:
      - cosmic

    depends_on:
      api-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── 6. Database backup (manual trigger only) ───────────────────────────────
  # Run on demand:
  #   docker compose --profile backup run --rm backup
  #
  # Or schedule via host cron:
  #   0 2 * * * cd /path/to/repo && docker compose --profile backup run --rm backup
  backup:
    image: postgres:16-alpine
    profiles:
      - backup
    restart: "no"

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_backups:/backups

    networks:
      - cosmic

    depends_on:
      postgres:
        condition: service_healthy

    # Creates a timestamped gzipped backup, then prunes backups older than 7 days.
    command: >
      sh -c '
        DATE=$$(date +%Y%m%d_%H%M%S) &&
        FILE="/backups/backup_$$DATE.sql.gz" &&
        echo "[backup] Starting pg_dump → $$FILE" &&
        pg_dump -h postgres -U ${POSTGRES_USER:-postgres} ${POSTGRES_DB:-Astro-sentinel} | gzip > $$FILE &&
        echo "[backup] Backup complete: $$(du -sh $$FILE | cut -f1)" &&
        find /backups -name "backup_*.sql.gz" -mtime +7 -delete &&
        echo "[backup] Old backups pruned (kept last 7 days)"
      '

    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    # PostgreSQL data — survives container recreation.
    # To wipe: docker compose down -v

  postgres_backups:
    # pg_dump backup files — populated by the backup service (profile=backup).
    # To bind-mount to a host path for off-server storage, add:
    #   driver_opts:
    #     type: none
    #     o: bind
    #     device: /opt/astrosentinel-backups

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  cosmic:
    driver: bridge
    # All services communicate via Docker service names.
    # No service uses localhost to reach another service.
    # Example: api-server connects to postgres:5432, not localhost:5432.
